# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Test coverage
on:
  push:
  workflow_dispatch:
jobs:
  test:
    name: Report
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run tests
        run: |
          shopt -s globstar
          nix develop -c zig fmt --check ./src/**/*.zig
          nix develop -c zig build
          help="$(nix develop -c zig build run -- --help)"
          [[ "$help" == "usage: git coverage [options]"* ]]
          rm -rf kcov-output
          nix develop -c zig build test -Dcoverage
      - name: Verify coverage contains executed lines
        run: |
          for report in kcov-output/*/cobertura.xml; do
            coverage="$(<"$report")"
            [[ "$coverage" =~ lines-valid=\"[1-9][0-9]*\" ]]
            [[ "$coverage" =~ lines-covered=\"[1-9][0-9]*\" ]]
          done
      - name: Locate Codecov
        id: codecov
        run: echo "binary=$(command -v codecovcli)" >> "$GITHUB_OUTPUT"
      - name: Upload reports
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          binary: ${{ steps.codecov.outputs.binary }}
          fail_ci_if_error: true
          override_commit: ${{ github.sha }}
          slug: ${{ github.repository }}
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
