# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Test coverage
on:
  push:
  workflow_dispatch:
jobs:
  test:
    name: Report
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run tests
        run: |
          shopt -s globstar
          nix develop -c zig fmt --check ./src/**/*.zig
          nix develop -c zig build
          nix develop -c zig build test -Dcoverage
      - name: Locate Codecov
        id: codecov
        run: echo "binary=$(command -v codecovcli)" >> "$GITHUB_OUTPUT"
      - name: Upload reports
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          binary: ${{ steps.codecov.outputs.binary }}
          fail_ci_if_error: true
          override_commit: ${{ github.sha }}
          slug: ${{ github.repository }}
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
